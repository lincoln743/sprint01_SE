ns, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Sensores IoT</text><text x="848" y="154" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">cerca perimetral, abertura de portas, movimento,</text><text x="848" y="173" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">vibração, radiação ambiental e meteorologia</text><rect x="40" y="268" width="1180" height="186" rx="12" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="60" y="296" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#1f4e79" font-weight="bold" text-anchor="start">PLATAFORMA — onde o dado vira informação</text><rect x="60" y="312" width="368" height="126" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.4"/><text x="76" y="338" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Ingestão e normalização</text><text x="76" y="362" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">fila de eventos, carimbo de tempo e</text><text x="76" y="381" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">geolocalização padronizados</text><rect x="446" y="312" width="368" height="126" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.4"/><text x="462" y="338" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Correlação e IA</text><text x="462" y="362" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">fusão de múltiplas fontes, pontuação de risco e</text><text x="462" y="381" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal"