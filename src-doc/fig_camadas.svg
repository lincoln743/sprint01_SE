nchor="start">vídeo, trilha do evento e ações do operador</text><text x="462" y="589" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">em uma única tela</text><rect x="832" y="520" width="368" height="126" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.4"/><text x="848" y="546" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Registro e auditoria</text><text x="848" y="570" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">ocorrência assinada, trilha imutável e relatório</text><text x="848" y="589" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#333333" font-weight="normal" text-anchor="start">para o regulador</text><rect x="52" y="678" width="262" height="42" rx="4" fill="#e6def7" stroke="#4b2e83" stroke-width="1.8"/><text x="183" y="705" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#4b2e83" font-weight="bold" text-anchor="middle">DADOS</text><text x="183" y="742" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="middle">sensores, imagens</text><text x="183" y="759" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="middle">e telemetria</text><line x1="318" y1="699" x2="346" y2="699" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="352" y="678" width="262" height="42" rx="4" fill="#e6def7" stroke="#4b2e83" stroke-width="1.8"/><text x="483" y="705" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#4b2e83" font-weight="bold" text-anchor="middle">INFORMAÇÃO</text><text x="483" y="742" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="middle">eventos correlacionados</text><text x="483" y="759" 