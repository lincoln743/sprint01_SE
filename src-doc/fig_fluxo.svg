<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="820" viewBox="0 0 1260 820"><defs><marker id="pf" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#444444"/></marker></defs><rect x="0" y="0" width="1260" height="820" fill="#ffffff"/><rect x="60" y="60" width="250" height="100" rx="10" fill="#dff0e4" stroke="#1e6b3a" stroke-width="2.2"/><text x="185" y="88" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">1 · Captura</text><text x="185" y="112" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">sensor, câmera ou drone</text><text x="185" y="130" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">registra um evento</text><line x1="314" y1="110" x2="364" y2="110" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="368" y="60" width="250" height="100" rx="10" fill="#dff0e4" stroke="#1e6b3a" stroke-width="2.2"/><text x="493" y="88" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">2 · Borda</text><text x="493" y="112" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">visão computacional classifica</text><text x="493" y="130" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">o quadro em milissegundos</text><line x1="622" y1="110" x2="672" y2="110" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="676" y="60" width="250" height="100" rx="10" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="801" y="88" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">3 · Correlação</text><text x="801" y="112" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">a plataforma cruza as fontes</text><text x="801" y="130" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">e pontua o risco</text><line x1="930" y1="110" x2="980" y2="110" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="984" y="60" width="220" height="100" rx="10" fill="#dce9f5" stroke="#1f4e79" stroke-width="2.2"/><text x="1094" y="88" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">4 · Alerta</text><text x="1094" y="112" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">severidade atribuída</text><text x="1094" y="130" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">e alerta publicado</text><line x1="1094" y1="164" x2="1094" y2="212" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="900" y="216" width="304" height="100" rx="10" fill="#fbeed2" stroke="#8a5a00" stroke-width="2.2"/><text x="1052" y="244" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">5 · Painel operacional</text><text x="1052" y="268" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">alerta entra na fila, com mapa,</text><text x="1052" y="286" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">vídeo e contexto do evento</text><line x1="898" y1="266" x2="848" y2="266" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><polygon points="700,211 845,266 700,321 555,266" fill="#fbf4cd" stroke="#7a6500" stroke-width="2"/><text x="700" y="258" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">6 · O operador confirma</text><text x="700" y="278" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">a anomalia?</text><line x1="700" y1="322" x2="700" y2="372" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="712" y="350" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#1e6b3a" font-weight="normal" text-anchor="start">sim</text><rect x="560" y="376" width="280" height="100" rx="10" fill="#fadde2" stroke="#9b1c31" stroke-width="2.2"/><text x="700" y="404" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">7 · Verificação</text><text x="700" y="428" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">drone é despachado para a</text><text x="700" y="446" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">coordenada e transmite ao vivo</text><line x1="554" y1="266" x2="464" y2="266" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="500" y="254" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#9b1c31" font-weight="normal" text-anchor="start">não</text><rect x="200" y="216" width="264" height="100" rx="10" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2.2"/><text x="332" y="244" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">6a · Falso positivo</text><text x="332" y="268" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">operador classifica o motivo;</text><text x="332" y="286" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">o caso realimenta o modelo</text><line x1="332" y1="318" x2="332" y2="742" stroke="#666666" stroke-width="2.4"/><line x1="332" y1="742" x2="494" y2="742" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><line x1="700" y1="480" x2="700" y2="530" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="560" y="534" width="280" height="100" rx="10" fill="#fadde2" stroke="#9b1c31" stroke-width="2.2"/><text x="700" y="562" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">8 · Resposta</text><text x="700" y="586" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">equipe de segurança é acionada</text><text x="700" y="604" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">com instrução e localização</text><line x1="700" y1="638" x2="700" y2="688" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="500" y="692" width="400" height="100" rx="10" fill="#e6def7" stroke="#4b2e83" stroke-width="2.2"/><text x="700" y="720" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle">9 · Registro e auditoria</text><text x="700" y="744" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">ocorrência registrada com trilha completa, disponível para</text><text x="700" y="762" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="middle">relatório e para o órgão regulador</text><text x="52" y="520" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#555555" font-weight="bold" text-anchor="start">Realimentação do modelo</text><text x="52" y="544" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="start">Tanto a confirmação quanto o</text><text x="52" y="563" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="start">falso positivo são rotulados pelo</text><text x="52" y="582" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="start">operador e entram no conjunto</text><text x="52" y="601" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="start">de treinamento — a precisão do</text><text x="52" y="620" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="start">sistema cresce com o uso.</text></svg>