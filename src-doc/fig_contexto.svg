<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="700" viewBox="0 0 1260 700"><defs><marker id="pf" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 z" fill="#444444"/></marker></defs><rect x="0" y="0" width="1260" height="700" fill="#ffffff"/><rect x="360" y="230" width="520" height="230" rx="14" fill="#dff0e4" stroke="#1e6b3a" stroke-width="2.6"/><text x="620" y="282" font-family="DejaVu Sans, Verdana, sans-serif" font-size="26" fill="#1e6b3a" font-weight="bold" text-anchor="middle">ARGOS</text><text x="620" y="312" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#444444" font-weight="normal" text-anchor="middle">[Sistema de software]</text><text x="620" y="346" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#222222" font-weight="normal" text-anchor="middle">Monitora o perímetro e as áreas restritas da instalação,</text><text x="620" y="365" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#222222" font-weight="normal" text-anchor="middle">correlaciona sensores, câmeras e drones, classifica o risco</text><text x="620" y="384" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#222222" font-weight="normal" text-anchor="middle">e apoia a decisão do operador em tempo real.</text><rect x="40" y="120" width="250" height="108" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="60" y="150" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Operador de</text><text x="60" y="170" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">monitoramento</text><text x="60" y="194" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">acompanha o painel e</text><text x="60" y="212" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">valida cada alerta</text><line x1="294" y1="174" x2="356" y2="300" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="300" width="250" height="108" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="60" y="330" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Equipe de</text><text x="60" y="350" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">segurança física</text><text x="60" y="374" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">recebe o despacho e</text><text x="60" y="392" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">atende a ocorrência</text><line x1="294" y1="354" x2="356" y2="310" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="40" y="480" width="250" height="108" rx="4" fill="#ebebeb" stroke="#3f3f3f" stroke-width="2"/><text x="60" y="510" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">Gestor da</text><text x="60" y="530" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14.5" fill="#111111" font-weight="bold" text-anchor="start">instalação</text><text x="60" y="554" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">acompanha indicadores</text><text x="60" y="572" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">e relatórios</text><line x1="294" y1="534" x2="356" y2="300" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="930" y="60" width="290" height="110" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="950" y="88" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">Sistema de controle</text><text x="950" y="107" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">de acesso</text><text x="950" y="132" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">credenciais e registro</text><text x="950" y="149" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">de entrada e saída</text><line x1="884" y1="320" x2="926" y2="115" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="930" y="210" width="290" height="110" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="950" y="238" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">CFTV existente</text><text x="950" y="263" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">fluxo de vídeo das</text><text x="950" y="280" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">câmeras já instaladas</text><line x1="884" y1="320" x2="926" y2="265" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="930" y="360" width="290" height="110" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="950" y="388" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">Estação meteorológica</text><text x="950" y="407" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">e monitoração radiológica</text><text x="950" y="432" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">condições ambientais</text><text x="950" y="449" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">e taxa de dose</text><line x1="884" y1="320" x2="926" y2="415" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><rect x="930" y="510" width="290" height="110" rx="4" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/><text x="950" y="538" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">Centro de operações</text><text x="950" y="557" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#1f4e79" font-weight="bold" text-anchor="start">da instalação</text><text x="950" y="582" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">notificação e</text><text x="950" y="599" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12.5" fill="#444444" font-weight="normal" text-anchor="start">registro de ocorrência</text><line x1="884" y1="320" x2="926" y2="565" stroke="#444444" stroke-width="2.4" marker-end="url(#pf)"/><text x="40" y="640" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="start">Pessoas</text><text x="930" y="640" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="start">Sistemas e fontes externas</text><text x="620" y="660" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle" font-style="italic">Diagrama de contexto (C4 — nível 1). O detalhamento em contêineres e componentes será produzido na Sprint 2.</text></svg>